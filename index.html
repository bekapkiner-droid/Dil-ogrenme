<title>Filiz Dil Bahçesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: tek sütun uygulama; üstte dil ve haftalık hedef, altında sekmeler (Yol, Bahçe, Hikaye, Defter). Ders ekranı tam odak. */
:root{
  --bg:#eef3f0; --surface:#ffffff; --ink:#12261f; --muted:#5b6f67; --line:#d5e0da;
  --leaf:#2c9a68; --leaf-d:#1f7650; --leaf-soft:#d9f0e4; --sun:#f0b429; --sun-soft:#fdf0cc;
  --bad:#d4553f; --bad-soft:#fbe3dd; --soil:#8a6a4f;
  --display:'Unbounded','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a16; --surface:#16261f; --ink:#e6f2ec; --muted:#93aaa0; --line:#264036;
  --leaf:#4cc08a; --leaf-d:#7fd9ad; --leaf-soft:#1c3b2e; --sun:#f3c04d; --sun-soft:#3b3216;
  --bad:#ef7b66; --bad-soft:#40211b; --soil:#a88868; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a16; --surface:#16261f; --ink:#e6f2ec; --muted:#93aaa0; --line:#264036;
  --leaf:#4cc08a; --leaf-d:#7fd9ad; --leaf-soft:#1c3b2e; --sun:#f3c04d; --sun-soft:#3b3216;
  --bad:#ef7b66; --bad-soft:#40211b; --soil:#a88868; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
select,input[type=text]{font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.week{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.week-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.bar{height:12px;background:var(--leaf-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
.days{display:flex;gap:6px}
.days span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.days span.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.muted{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:5px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:9px 14px;border-radius:11px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--leaf);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.alt{background:var(--sun);color:#2a2000;box-shadow:0 3px 0 #b88a14}
.btn.ghost{background:none;box-shadow:none;border:2px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.mini{height:8px;background:var(--leaf-soft);border-radius:9px;overflow:hidden}.mini i{display:block;height:100%;background:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--leaf-soft);color:var(--leaf-d);border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.chip.warn{background:var(--sun-soft);color:var(--ink)}
.plot{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.plant{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.plant svg{width:64px;height:70px}
.plant b{font-family:var(--display);overflow-wrap:anywhere}
.plant small{color:var(--muted)}
.plant.wilt{border-color:var(--sun)}
.s-leaf{fill:var(--leaf)}.s-stem{stroke:var(--leaf-d);stroke-width:3;fill:none;stroke-linecap:round}
.s-soil{fill:var(--soil)}.s-pet{fill:var(--sun)}.s-core{fill:var(--bad)}.s-seed{fill:var(--ink)}
.wilt .s-leaf{fill:#a9a35a}.wilt .s-stem{stroke:#8f8a49}.wilt .plantg{transform-origin:32px 56px;transform:rotate(14deg)}
/* ders */
.lesson{display:flex;flex-direction:column;gap:16px;min-height:70vh}
.lhead{display:flex;align-items:center;gap:12px}
.lhead .bar{flex:1}
.xbtn{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--muted);padding:4px 8px}
.q{display:flex;flex-direction:column;gap:14px;flex:1}
.prompt{font-family:var(--display);font-size:1.5rem;font-weight:800;text-wrap:balance}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt:hover{border-color:var(--leaf)}
.opt.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.hint{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px 0}
.tray{border-bottom:2px solid var(--line);min-height:56px;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.fb{border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.fb.ok{background:var(--leaf-soft)}.fb.no{background:var(--bad-soft)}
.say{border:0;background:var(--leaf-soft);color:var(--leaf-d);width:44px;height:44px;border-radius:50%;font-size:1.1rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:14px 16px;max-width:560px}
.bubble.me{align-self:flex-end;background:var(--leaf-soft);border-radius:18px 18px 4px 18px;border-color:var(--leaf)}
.chat{display:flex;flex-direction:column;gap:12px}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* ===== Liquid glass katmanı ===== */
:root{--glass:rgba(255,255,255,.42);--glass-hi:rgba(255,255,255,.66);--glass-line:rgba(255,255,255,.8);--glass-sh:rgba(18,70,50,.16);--b1:#7fe0b0;--b2:#ffd66b;--b3:#8fd3e8;--onleaf:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(40,72,60,.4);--glass-hi:rgba(80,120,102,.45);--glass-line:rgba(255,255,255,.17);--glass-sh:rgba(0,0,0,.45);--b1:#1f7a52;--b2:#7a5d10;--b3:#1d5f78;--onleaf:#06241a}}
:root[data-theme="dark"]{--glass:rgba(40,72,60,.4);--glass-hi:rgba(80,120,102,.45);--glass-line:rgba(255,255,255,.17);--glass-sh:rgba(0,0,0,.45);--b1:#1f7a52;--b2:#7a5d10;--b3:#1d5f78;--onleaf:#06241a}
html,body{min-height:100%}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--b1);left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){background:var(--b2);right:-14vmax;top:22vh;animation-duration:28s;animation-delay:-8s}
.blobs i:nth-child(3){background:var(--b3);left:18vw;bottom:-22vmax;animation-duration:25s;animation-delay:-14s}
@keyframes drift{to{transform:translate(9vmax,6vmax) scale(1.18)}}
.wrap{position:relative;z-index:1}
.card,.week,.tabs,.plant,.bubble,.hint,.fb,.opt,.tile,.tray,select,input[type=text]{
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--glass-line),inset 0 -1px 0 rgba(255,255,255,.08),0 10px 28px var(--glass-sh)}
.card,.week,.plant,.bubble,.opt,.fb,.tabs{position:relative;overflow:hidden}
.card::before,.week::before,.plant::before,.opt::before,.bubble::before,.fb::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.14) 100%);opacity:.7}
.card>*,.week>*,.plant>*,.opt>*,.fb>*{position:relative}
.tabs{border-radius:99px}.tabs button{border-radius:99px;transition:background .3s,color .3s,transform .2s}
.tabs button[aria-selected=true]{background:var(--leaf);color:var(--onleaf);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px var(--glass-sh)}
.tabs button:not([aria-selected=true]):hover{background:var(--glass-hi);transform:translateY(-1px)}
.btn{color:var(--onleaf);border:1px solid rgba(255,255,255,.45);background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),var(--leaf);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px var(--glass-sh);transition:transform .18s,box-shadow .18s,filter .18s}
.btn:hover:not([disabled]){transform:translateY(-2px);filter:brightness(1.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 22px var(--glass-sh)}
.btn:active{transform:scale(.96);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.alt{color:#2a2000;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--sun)}
.btn.ghost{background:var(--glass)}
.opt,.tile{transition:transform .2s cubic-bezier(.3,1.5,.5,1),border-color .2s,background .2s}
.opt:hover:not([disabled]),.tile:hover:not([disabled]){transform:translateY(-3px) scale(1.02)}
.opt.ok{background:var(--leaf-soft);animation:pulse .6s}
.opt.no{background:var(--bad-soft);animation:shake .45s}
.opt:disabled{cursor:default}
.tile{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.say{background:var(--glass-hi);border:1px solid var(--glass-line);transition:transform .2s}.say:hover{transform:scale(1.12) rotate(-6deg)}
.bar,.mini{background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 2px 4px var(--glass-sh)}
.bar i,.mini i{background:linear-gradient(90deg,var(--leaf),color-mix(in srgb,var(--leaf) 55%,#fff));position:relative;overflow:hidden}
.bar i::after,.mini i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s infinite}
.week .bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1)}
.days span{background:var(--glass);border:1px solid var(--glass-line)}.days span.on{background:var(--leaf);color:var(--onleaf);animation:pop .5s backwards}
.chip{background:var(--glass-hi);border:1px solid var(--glass-line);color:var(--ink)}.chip.warn{background:var(--sun-soft)}
/* hareket */
main.enter .card,main.enter .plant,main.enter .chip,main.enter h3,main.enter form,main.enter .empty{animation:rise .6s cubic-bezier(.2,.9,.3,1) backwards}
main.enter .card:nth-child(2),main.enter .plant:nth-child(2){animation-delay:.06s}
main.enter .card:nth-child(3),main.enter .plant:nth-child(3){animation-delay:.12s}
main.enter .card:nth-child(4),main.enter .plant:nth-child(4){animation-delay:.18s}
main.enter .card:nth-child(n+5),main.enter .plant:nth-child(n+5){animation-delay:.24s}
.q.enter>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) backwards}
.q.enter>*:nth-child(2){animation-delay:.07s}.q.enter>*:nth-child(3){animation-delay:.14s}.q.enter>*:nth-child(4){animation-delay:.2s}
.fb{animation:slideup .4s cubic-bezier(.2,1.2,.4,1)}
.chat>:nth-last-child(-n+2){animation:rise .5s cubic-bezier(.2,.9,.3,1)}
.plantg{transform-origin:32px 58px;animation:sway 4.5s ease-in-out infinite}
.plant:nth-child(2n) .plantg{animation-delay:-1.5s}.plant:nth-child(3n) .plantg{animation-delay:-3s}
.plant{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.plant:hover{transform:translateY(-4px) scale(1.05)}
.wilt .plantg{animation:none}
.brand svg{animation:sway 5s ease-in-out infinite;transform-origin:50% 85%}
.lesson>div:first-child svg{animation:grow-up 1s cubic-bezier(.2,1.4,.4,1) .1s backwards}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;text-transform:lowercase}
h2{font-size:1.05rem;font-weight:700}h3{font-size:.95rem;font-weight:500}
.prompt{font-size:1.1rem;font-weight:500;line-height:1.35}.big{font-size:1.6rem;font-weight:700;overflow-wrap:anywhere}
.plant b{font-size:.85rem;font-weight:500}.blobs i{opacity:.55}
.s-leaf,.s-pet,.s-core,.s-soil,.s-seed{stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.s-seed{fill:var(--soil)}.s-stem{stroke:var(--ink)}
.detail{margin-bottom:14px}
.btn,.opt,.tile,.tabs button,.say,.xbtn{position:relative;overflow:hidden}
.wipe{position:fixed;inset:0;z-index:4;pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  background:linear-gradient(100deg,transparent 0 28%,var(--glass-hi) 42%,rgba(255,255,255,.6) 50%,var(--glass-hi) 58%,transparent 72% 100%);
  -webkit-mask-image:linear-gradient(100deg,transparent 0 22%,#000 40% 60%,transparent 78%);mask-image:linear-gradient(100deg,transparent 0 22%,#000 40% 60%,transparent 78%)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.press{animation:press .14s ease-out}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes press{50%{transform:scale(.9)}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes slideup{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pulse{40%{transform:scale(1.05)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes grow{from{width:0}}
@keyframes sway{50%{transform:rotate(3deg)}0%,100%{transform:rotate(-3deg)}}
@keyframes grow-up{from{transform:scale(0) rotate(-20deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.week,.tabs,.plant,.bubble,.hint,.fb,.opt,.tile,.tray,select,input[type=text]{background:var(--surface)}}
.opts{grid-template-columns:1fr!important}
.opt{display:flex;align-items:center;gap:14px;font-size:1.05rem}
.ltr{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--glass-hi);border:1px solid var(--glass-line);transition:background .2s,color .2s}
.opt:hover:not([disabled]) .ltr{background:var(--leaf);color:var(--onleaf)}
.opt.ok .ltr{background:var(--leaf);color:var(--onleaf)}.opt.no .ltr{background:var(--bad);color:#fff}
.q.enter .opt{animation:rise .55s cubic-bezier(.2,.9,.3,1) backwards}
.q.enter .opt:nth-child(1){animation-delay:.12s}.q.enter .opt:nth-child(2){animation-delay:.2s}.q.enter .opt:nth-child(3){animation-delay:.28s}.q.enter .opt:nth-child(4){animation-delay:.36s}
@media (prefers-reduced-motion:reduce){.blobs i,.plantg,.brand svg,.bar i::after,.mini i::after{animation:none!important}}
/* ===== Alt menü (yüzen cam çubuk) ve mobil düzeltmeler ===== */
body{padding-block:20px calc(120px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  transition:transform .45s cubic-bezier(.2,1.1,.3,1),opacity .3s,visibility 0s}
.dock.off{transform:translateY(160%);opacity:0;visibility:hidden;transition:transform .4s,opacity .3s,visibility 0s .4s}
.dock-in{display:flex;gap:10px;align-items:center;width:min(560px,100%);pointer-events:auto}
.dock-pill{position:relative;flex:1;display:flex;padding:5px;border-radius:99px;min-width:0;
  background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:inset 0 1px 0 var(--glass-line),0 12px 32px var(--glass-sh)}
.dock-pill::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:99px;
  background:var(--glass-hi);border:1px solid var(--glass-line);box-shadow:0 4px 14px var(--glass-sh);
  transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.dk{position:relative;overflow:hidden;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border:0;background:none;border-radius:99px;
  color:var(--muted);font-size:.7rem;font-weight:700;transition:color .3s}
.dk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.dk[aria-selected=true]{color:var(--leaf-d)}.dk[aria-selected=true] svg{transform:translateY(-1px) scale(1.12)}
.dk-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:700 .65rem/17px var(--body);font-style:normal;text-align:center}
.dock-fab{position:relative;overflow:hidden;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--onleaf);
  border:1px solid rgba(255,255,255,.5);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%),var(--leaf);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 28px var(--glass-sh);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.dock-fab svg{width:24px;height:24px;fill:currentColor;margin-left:2px}
.dock-fab:active{transform:scale(.9)}
.xbtn{min-width:44px;min-height:44px}
@media (hover:none){
  .opt:hover:not([disabled]),.tile:hover:not([disabled]),.plant:hover,.btn:hover:not([disabled]),.say:hover{transform:none;filter:none}
  .opt:hover:not([disabled]):not(.ok):not(.no) .ltr{background:var(--glass-hi);color:inherit}
}
button,.dk,.dock-fab,.opt,.tile{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body.inlesson{padding-block:20px calc(12px + env(safe-area-inset-bottom,0px))}
.lesson{min-height:calc(100dvh - 32px - env(safe-area-inset-bottom,0px))}
.lesson>.q{flex:1}
.act{position:sticky;bottom:0;z-index:3;margin-top:auto;padding:16px 0 calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 55%,transparent) 50%)}
.act .btn{display:block;width:100%;padding:15px 18px;font-size:1.05rem}

function tone(f,d,type,vol,delay,f2){
  try{
    if(S.mute)return;

    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();

    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}}

function opts(w,key,ans,pool){
  const o=shuffle(pool.filter(x=>x[key]!==w[key])).slice(0,3).map(x=>x[key]);return shuffle(o.concat(ans));}
function buildLesson(ws_,sents){
  const pool=allWords(),Q=[];
  ws_.forEach(w=>{if(ws(w).lvl===0)Q.push({k:'intro',w})});
  shuffle(ws_).forEach(w=>Q.push(Math.random()<.5?{k:'tr2t',w,o:opts(w,'tr',w.tr,pool)}:{k:'t2tr',w,o:opts(w,'t',w.t,pool)}));
  shuffle(ws_).forEach((w,i)=>Q.push({k:i%2?'listen':'type',w,o:opts(w,'t',w.t,pool),final:true}));
  shuffle(sents).slice(0,2).forEach(s=>Q.push({k:'build',s,tiles:shuffle(s.t.split(' '))}));
  return Q;}
function start(list,sents){

  else if(q.k==='tr2t'||q.k==='t2tr'||q.k==='listen'){

  else{act=`<button class="btn" data-act="check" ${V.built.length?'':'disabled'}>Kontrol et</button>`;body=`<div class="prompt">Cümleyi kur</div><div class="big" style="font-size:1.5rem">${esc(q.s.tr)}</div><div class="tray">${V.built.map((t,i)=>`<button class="tile" data-un="${i}" ${fb?'disabled':''}>${esc(t)}</button>`).join('')}</div><div class="tiles">${q.tiles.map((t,i)=>(V.usedIdx||[]).includes(i)?'':`<button class="tile" data-tile="${i}" ${fb?'disabled':''}>${esc(t)}</button>`).join('')}</div>`}

  a.innerHTML=`<div class="lesson"><div class="lhead"><button class="xbtn" data-act="quit" aria-label="Dersten çık">×</button><div class="bar"><i style="width:${pc}%"></i></div></div><div class="q${fresh?' enter':''}">${body}</div>${foot}${act&&!fb?`<div class="act">${act}</div>`:''}</div>`;

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled||V.busy)return;
  ripple(b,e);
  const d=b.dataset,nav=d.tab||d.ch!=null||(d.act&&d.act!=='check'&&d.act!=='mute'&&!/^sug/.test(d.act));
  if(nav&&!reduce){
    V.busy=true;b.classList.add('press');
    const tgt=d.tab?$('main'):(d.act==='next'||d.act==='snext')?null:$('#app');
    const ex=tgt&&tgt.animate?tgt.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:`translateX(${d.tab?-36:-60}px) scale(.96)`,filter:'blur(6px)'}],{duration:200,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}):null;

const msg=t=>{const e=$('#bkmsg');if(e)e.textContent=t};
function handle(b){
  const d=b.dataset,q=V.lq&&V.lq[V.i];
  if(d.tab)sfx.tab();else if(d.say||d.tile!=null||d.un!=null)sfx.tile();
  else if(d.pick==null&&d.act!=='check'&&d.act!=='mute')sfx.click();
  if(d.plant!=null){V.sel=V.sel===d.plant?null:d.plant;const w=allWords().find(x=>x.t===d.plant);if(w&&V.sel)speak(w.t);return render()}
  if(d.tab){V.tab=d.tab;return render()}
  if(d.say){return speak(d.say)}
  if(d.pick!=null&&q){V.pick=d.pick;return answer(d.pick===(q.k==='tr2t'?q.w.tr:q.w.t),q)}
  if(d.tile!=null&&q){V.usedIdx=V.usedIdx||[];V.usedIdx.push(+d.tile);V.built.push(q.tiles[+d.tile]);return render()}
  if(d.un!=null&&q){const i=+d.un;V.built.splice(i,1);V.usedIdx.splice(i,1);return render()}
  if(d.ch!=null){V.ans[V.n]=+d.ch;V.sc+=L[S.lang].st[V.si].c[V.n][+d.ch][2];return render()}
  const a=d.act;if(!a)return;
  if(a==='bkcopy'){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const ok=()=>msg('Kod kopyalandı.'),no=()=>{const i=$('#bk');i.value=code;i.select();msg('Kodu elle kopyala.')};
    try{navigator.clipboard.writeText(code).then(ok,no)}catch(e){no()}return}
  if(a==='bkload'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));if(!o||typeof o!=='object'||!o.words)throw 0;S=Object.assign({lang:'en',goal:60,words:{},custom:{},min:{},story:{}},o);save();render();msg('İlerleme geri yüklendi.')}catch(e){msg('Kod geçersiz.')}return}
  if(a==='notify'){toggleNotify().then(t=>{render();const e=$('#ntmsg');if(e)e.textContent=t});return}
  if(a==='sugyes'&&q){V.sug=null;V.pick=q.w.t;return answer(true,q)}
  if(a==='sugno'){V.sug=null;return render()}
  if(a==='mute'){S.mute=!S.mute;save();sfx.click();return render()}
  if(a==='lesson'){const g=groups().find(x=>x.id===d.g);V.usedIdx=[];start(g.w,g.s)}
  else if(a==='water'){V.usedIdx=[];start(shuffle(allWords().filter(isDue)).slice(0,5),[])}
  else if(a==='quick'){V.usedIdx=[];const dw=allWords().filter(isDue);
    if(dw.length)start(shuffle(dw).slice(0,5),[]);
    else{const g=groups().find(x=>x.w.some(w=>ws(w).lvl<4))||groups()[0];start(g.w,g.s)}}
  else if(a==='mist'){V.usedIdx=[];start(shuffle(mistakes()).slice(0,5),[])}
  else if(a==='story'){V.view='story';V.si=+d.si;V.n=0;V.sc=0;V.ans=[];render()}
  else if(a==='snext'){V.n++;render()}
  else if(a==='sdone'){const k=dkey();S.min[k]=(S.min[k]||0)+2;{const sk=S.lang+':'+V.si;if(S.story[sk]==null||V.sc>S.story[sk])S.story[sk]=V.sc}save();V.res={mins:2,story:V.sc};V.view='done';render()}
  else if(a==='home'||a==='quit'){V.view='home';render()}
  else if(a==='next')next();
  else if(a==='check'&&q){
    if(q.k==='type'){const v=$('#ty').value;if(!v.trim())return;V.typed=v;
      const nv=norm(v),nt=norm(q.w.t),len=nt.length,lim=len>=7?2:len>=4?1:0;
      if(nv===nt){V.pick=v;V.sug=null;answer(true,q)}
      else if(!q.sugUsed&&lim&&lev(nv,nt)<=lim){q.sugUsed=true;V.sug=q.w.t;render()}
      else{V.pick=v;V.sug=null;answer(false,q)}}
    else answer(norm(V.built.join(' '))===norm(q.s.t),q)}
}
document.addEventListener('keydown',e=>{
  if(!e.target.closest('input')&&!e.ctrlKey&&!e.metaKey){const i='abcd'.indexOf(e.key.toLowerCase());const o=i>=0&&document.querySelectorAll('.opt')[i];if(o&&!o.disabled&&e.key.length===1)o.click()}if(e.key==='Enter'&&e.target.id==='ty'){const b=document.querySelector('[data-act=check]');b&&b.click()}});
document.addEventListener('change',e=>{
  if(e.target.id==='lang'){S.lang=e.target.value;save();render()}
  if(e.target.id==='goal'){S.goal=+e.target.value;save();render()}});
document.addEventListener('submit',e=>{
  if(e.target.id==='addf'){e.preventDefault();
    const tr=$('#a-tr').value.trim(),t=$('#a-t').value.trim(),h=$('#a-h').value.trim();if(!tr||!t)return;
    (S.custom[S.lang]=S.custom[S.lang]||[]).push([tr,t,h]);save();render();}});
render();
scheduleReminders();
</script>
