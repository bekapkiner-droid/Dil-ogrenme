name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*']
    paths: ['index.html', 'package.json', 'capacitor.config.json', 'scripts/**', 'assets/**', 'plugins/**', 'filiz-debug.keystore', 'google-services.json', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - name: Uygulama simgesi ve açılış ekranı
        run: npx capacitor-assets generate --android
      - name: Bildirim izni (Android 13+)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $f
      - name: Sabit debug imzası (Google girişi için aynı SHA-1)
        run: mkdir -p ~/.android && cp filiz-debug.keystore ~/.android/debug.keystore
      - name: Firebase ayarı (varsa)
        run: if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
      - run: npx cap sync android
      - name: Debug APK derle
        run: |
          set -o pipefail
          cd android && ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log
      - name: Derleme hatası özeti
        if: failure()
        run: |
          msg=$(grep -E "error:|FAILED|What went wrong|Execution failed|cannot find symbol|Could not" -A3 gradle.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle hatasi::$msg"
      - name: APK imza parmak izi (Google girişi için SHA-1 ile eşleşmeli)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1|SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: filiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
