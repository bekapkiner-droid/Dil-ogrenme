name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*']
    paths: ['index.html', 'package.json', 'capacitor.config.json', 'scripts/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - name: Bildirim izni (Android 13+)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $f
      - run: npx cap sync android
      - name: Debug APK derle
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: filiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
